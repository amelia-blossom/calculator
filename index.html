<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор Урона</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">

  <style>
    :root {
      --accent: #66ff99;
      --accent-dark: #55cc99;
      --bg-overlay: rgba(10, 20, 10, 0.85);
      --text-main: #e0ffe0;
      --text-sub: #99bb99;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Bebas Neue', sans-serif;
      background: #0d0d0d url('https://images.steamusercontent.com/ugc/1771573146819330998/F47EDBD4BF74B56DB51F227933C4100408938AAE/') no-repeat center/cover fixed;
      color: var(--text-main);
    }

    .app-shell {
      display: grid;
      grid-template-columns: minmax(330px, 420px) minmax(0, 820px) minmax(330px, 420px);
      gap: 2.4rem;
      align-items: start;
      max-width: 1800px;
      margin: 2rem auto;
      padding: 0 1.2rem;
    }

    .app-shell .container {
      margin: 0;
    }

    .left-column,
    .right-column {
      position: sticky;
      top: 1rem;
      height: calc(100vh - 2rem);
      align-self: start;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .right-column {
      display: block;
    }

    .container,
    .side-card {
      background: var(--bg-overlay);
      border: 2px solid var(--accent);
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(102,255,153,.4);
    }

    .container {
      padding: 2rem 2.5rem;
      max-width: 820px;
    }

    .side-card {
      padding: 1.2rem;
    }

    .random-card {
      flex: 0 0 auto;
      overflow: visible;
    }

    .notes-card {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
    }

    .aggro-card {
      height: 100%;
      overflow: auto;
    }

    .mobile-tabs {
      display: none;
    }

    h1 {
      text-align: center;
      color: var(--accent);
      text-shadow: 0 0 5px #33ff77;
      font-size: 2.6rem;
      margin: 0 0 1rem;
    }

    h2 {
      margin: 2rem 0 0.5rem;
      font-size: 1.6rem;
      color: #aaffcc;
      border-bottom: 1px solid var(--accent);
      padding-bottom: 0.3rem;
    }

    .side-card h2 {
      margin-top: 0;
      color: var(--accent);
      border-bottom: 1px solid var(--accent);
      text-align: center;
      text-shadow: 0 0 5px #33ff77;
    }

    label {
      display: block;
      margin-top: 1rem;
      font-size: 1.2rem;
    }

    small {
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    .field-hint {
      display: block;
      margin-top: 0.15rem;
      color: var(--text-sub);
      font-size: 0.9rem;
    }

    input[type="number"],
    input[type="text"],
    select,
    input[type="range"],
    textarea {
      width: 100%;
      padding: 0.75rem;
      font-size: 1.1rem;
      background: #111;
      color: var(--text-main);
      border: 1px solid var(--accent-dark);
      border-radius: 6px;
      box-shadow: 0 0 5px rgba(102,255,153,.2);
      font-family: inherit;
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(224, 255, 224, 0.45);
    }

    input[type="range"] {
      cursor: pointer;
    }

    button {
      background: var(--accent-dark);
      color: #001f0f;
      border: none;
      padding: 0.8rem 1.6rem;
      font-size: 1.2rem;
      margin-top: 1.5rem;
      border-radius: 6px;
      cursor: pointer;
      transition: .25s;
      box-shadow: 0 0 10px rgba(85,204,153,.4);
      font-family: inherit;
    }

    button:hover {
      background: var(--accent);
      box-shadow: 0 0 14px rgba(85,255,170,.6);
    }

    .output,
    .side-result {
      margin-top: 1rem;
      font-size: 1.4rem;
      text-align: center;
      color: #99ffcc;
      text-shadow: 0 0 3px #33ff77;
    }

    .side-result {
      font-size: 1.2rem;
    }

    .hidden {
      display: none;
    }

    .block {
      margin-bottom: 3rem;
    }

    option[value="ZAYIN"] { color: lightgreen; }
    option[value="TETH"] { color: deepskyblue; }
    option[value="HE"] { color: gold; }
    option[value="WAW"] { color: violet; }
    option[value="ALEPH"] { color: red; }

    .field-row {
      display: flex;
      gap: 1rem;
      align-items: flex-start;
    }

    .field-half {
      width: 50%;
    }

    .field-third {
      width: 33.333%;
    }

    .field-half input,
    .field-third input {
      width: 100%;
    }

    .bonus-title {
      margin-top: 0.5rem;
    }

    .bonus-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 0.7rem;
      margin-top: 0.35rem;
    }

    .ally-bonus {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border: 1px solid var(--accent-dark);
      border-radius: 6px;
      background: rgba(10, 30, 15, 0.65);
      white-space: nowrap;
    }

    .result-section {
      margin-top: 0.55rem;
    }

    .result-list {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.4rem 0.7rem;
      margin-top: 0.35rem;
    }

    .result-badge {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      border: 1px solid var(--accent-dark);
      border-radius: 6px;
      background: rgba(10, 30, 15, 0.65);
      white-space: nowrap;
    }

    .random-range-title {
      text-align: center;
      font-size: 1.2rem;
      margin-top: 0.8rem;
    }

    .random-range-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 1rem;
      margin-top: 0.5rem;
    }

    .random-range-row label {
      width: 6.5rem;
      margin-top: 0;
      text-align: center;
    }

    .random-range-row input {
      text-align: center;
    }

    .random-count-row {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 0.7rem;
      margin-top: 1rem;
    }

    .random-count-row label {
      width: 6.5rem;
      margin-top: 0;
      text-align: center;
    }

    .random-count-row span {
      padding-bottom: 0.75rem;
      font-size: 1.1rem;
    }

    .button-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 0.8rem;
      margin-top: 1.3rem;
    }

    .button-row button {
      width: auto;
      margin-top: 0;
    }

    .button-row.two button {
      min-width: 8.5rem;
    }

    .aggro-row {
      display: flex;
      gap: 0.7rem;
      margin-top: 0.8rem;
    }

    .aggro-row input {
      width: 50%;
    }

    .aggro-row .aggro-name {
      flex: 1.2;
      min-width: 0;
      width: auto;
    }

    .aggro-row .aggro-value {
      flex: 0.8;
      min-width: 0;
      width: auto;
    }

    .aggro-remove {
      flex: 0 0 auto;
      width: 2.6rem;
      padding: 0.75rem 0;
      margin-top: 0;
      line-height: 1;
    }

    #notesText {
      width: 100%;
      height: calc(100% - 4.5rem);
      min-height: 12rem;
      resize: none;
      overflow: auto;
    }

    @media (max-width: 900px) {
      .mobile-tabs {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.4rem;
        position: sticky;
        top: 0;
        z-index: 20;
        padding: 0.5rem;
        background: rgba(5, 10, 5, 0.95);
        border-bottom: 1px solid var(--accent-dark);
      }

      .mobile-tabs button {
        width: 100%;
        margin: 0;
        padding: 0.55rem 0.3rem;
        font-size: 0.85rem;
      }

      .mobile-tabs button.active-tab {
        background: var(--accent);
        box-shadow: 0 0 14px rgba(85,255,170,.6);
      }

      .app-shell {
        display: block;
        max-width: 820px;
        margin: 1rem;
        padding: 0;
      }

      .left-column,
      .right-column {
        position: static;
        height: auto;
        display: block;
      }

      .app-section {
        display: none;
      }

      .app-section.active {
        display: block;
      }

      .side-card,
      .app-shell .container {
        margin: 0;
      }

      .side-card {
        padding: 1rem 1.2rem;
      }

      #notesText {
        height: 65vh;
        min-height: 65vh;
      }
    }

    @media (max-width: 600px) {
      .container {
        padding: 1rem 1.2rem;
        margin: 0;
        max-width: 100%;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.3rem;
      }

      label {
        font-size: 1rem;
        margin-top: 0.8rem;
      }

      input[type="number"],
      input[type="text"],
      select,
      input[type="range"],
      textarea {
        font-size: 0.95rem;
        padding: 0.6rem;
      }

      button {
        width: 100%;
        font-size: 1rem;
        padding: 0.7rem 1rem;
      }

      .button-row {
        display: flex;
      }

      .button-row button {
        width: auto;
      }

      .button-row.two button {
        flex: 1;
        min-width: 0;
      }

      .output,
      .side-result {
        font-size: 1.2rem;
      }

      .field-row {
        flex-direction: column;
        gap: 0;
      }

      .field-half,
      .field-third {
        width: 100%;
      }

      .random-range-row,
      .random-count-row {
        gap: 0.5rem;
      }

      .random-range-row label,
      .random-count-row label {
        width: 5.5rem;
      }

      .aggro-row {
        flex-direction: column;
        gap: 0;
      }

      .aggro-row input,
      .aggro-row .aggro-name,
      .aggro-row .aggro-value {
        width: 100%;
      }

      .aggro-remove {
        width: 100%;
        margin-top: 0.4rem;
      }
    }
  </style>
</head>

<body>
  <div class="mobile-tabs">
    <button class="active-tab" onclick="showTab('calcPanel', this)">Калькулятор</button>
    <button onclick="showTab('randomPanel', this)">Рандом</button>
    <button onclick="showTab('aggroPanel', this)">Агро</button>
    <button onclick="showTab('notesPanel', this)">Заметки</button>
  </div>

  <div class="app-shell">
    <aside class="left-column">
      <section class="side-card random-card app-section" id="randomPanel">
        <h2>Рандомайзер</h2>

        <div class="random-range-title">В диапазоне</div>

        <div class="random-range-row">
          <label>От
            <input type="number" id="randomMin" value="">
          </label>

          <label>До
            <input type="number" id="randomMax" value="">
          </label>
        </div>

        <div class="random-count-row">
          <label>Количество
            <input type="number" id="randomCount" value="" min="1">
          </label>
        </div>

        <div class="button-row">
          <button onclick="generateRandomNumbers()">Сгенерировать</button>
        </div>

        <div class="side-result" id="randomResult">
          Результат: —
        </div>
      </section>

      <section class="side-card notes-card app-section" id="notesPanel">
        <h2>Заметки</h2>
        <textarea id="notesText" placeholder="Простое текстовое поле с заметками..."></textarea>
      </section>
    </aside>

    <main class="container app-section active" id="calcPanel">
      <h1>Калькулятор Урона</h1>

      <div class="block">
        <h2>Наносимый урон</h2>

        <label>Урон
          <input type="number" id="base">
        </label>

        <div class="field-row">
          <label class="field-half">Личные множители урона
            <small class="field-hint">Ваши процентные бонусы или ослабления</small>
            <input type="text" id="multipliers" placeholder="Например: 50, 20, -30, -5">
          </label>

          <label class="field-half">Множители урона от союзников
            <small class="field-hint">Процентные бонусы, полученные от союзников</small>
            <input type="text" id="multipliers2" placeholder="Например: 10, 1.5, 12">
          </label>
        </div>

        <label>Дополнительный урон
          <input type="number" id="add" value="0">
        </label>

        <label>Скорость атаки
          <select id="speed" onchange="updateVisibility()">
            <option value="very_slow">Очень медленная</option>
            <option value="slow">Медленная</option>
            <option value="medium">Средняя</option>
            <option value="fast">Высокая</option>
            <option value="very_fast">Очень высокая</option>
          </select>
        </label>

        <div id="justiceBlock">
          <label>Уровень Справедливости
            <select id="justiceLevel">
              <option value="1">I</option>
              <option value="2">II</option>
              <option value="3">III</option>
              <option value="4">IV</option>
              <option value="5">V</option>
            </select>
          </label>
        </div>

        <div id="onslaughtBlock" class="hidden">
          <label>Уровень Натиска
            <select id="onslaughtLevel">
              <option value="1">Рвение (60%)</option>
              <option value="2">I (70%)</option>
              <option value="3">II (80%)</option>
              <option value="4">III (90%)</option>
              <option value="5">IV (100%)</option>
              <option value="6">Рвение IV+ (110%)</option>
              <option value="7">Рвение IV++ (120%)</option>
            </select>
          </label>
        </div>

        <div class="output" id="resultDealt">Нанесённый урон: —</div>

        <button onclick="calcDealt()">Рассчитать</button>
        <button onclick="resetDealt()">Сбросить</button>
      </div>

      <div class="block">
        <h2>Получаемый урон</h2>

        <div class="field-row">
          <label class="field-third">Входящий урон
            <input type="number" id="incoming">
          </label>

          <label class="field-third">Личный щит
            <input type="number" id="shield">
          </label>

          <label class="field-third">Щиты от союзников
            <input type="text" id="shield2" placeholder="Например: 5, 10">
          </label>
        </div>

        <label>Тип входящего урона
          <select id="recType" onchange="updateVisibility()">
            <option value="raw">Обычный</option>
            <option value="pale">Бледный</option>
          </select>
        </label>

        <div id="paleBlock" class="hidden">
          <label>Максимум ХП юнита
            <input type="number" id="maxHP_recv">
          </label>

          <label>Кем наносится урон?
            <select id="paleSource_recv">
              <option value="0.25">Агент (0.25)</option>
              <option value="1.0">Аномалия (1.0)</option>
              <option value="0.4">Memento Mori (0.4)</option>
            </select>
          </label>
        </div>

        <div class="field-row">
          <label class="field-half">Личные множители защиты
            <small class="field-hint">Ваши процентные бонусы или ослабления</small>
            <input type="text" id="defMultipliers" placeholder="Например: 50, 20, -30, -5">
          </label>

          <label class="field-half">Множители защиты от союзников
            <small class="field-hint">Процентные бонусы, полученные от союзников</small>
            <input type="text" id="defMultipliers2" placeholder="Например: 10, 1.5, 12">
          </label>
        </div>

        <label>Класс оружия
          <select id="weaponClass">
            <option value="ZAYIN">ZAYIN</option>
            <option value="TETH">TETH</option>
            <option value="HE">HE</option>
            <option value="WAW">WAW</option>
            <option value="ALEPH">ALEPH</option>
          </select>
        </label>

        <label>Класс брони
          <select id="armorClass">
            <option value="ZAYIN">ZAYIN</option>
            <option value="TETH">TETH</option>
            <option value="HE">HE</option>
            <option value="WAW">WAW</option>
            <option value="ALEPH">ALEPH</option>
          </select>
        </label>

        <label>Сопротивление: <span id="resValue">1.0</span>
          <input type="range" id="res" min="0.1" max="2.0" step="0.1" value="1">
        </label>

        <div class="output" id="resultReceived">Полученный урон: —</div>

        <button onclick="calcReceived()">Рассчитать</button>
        <button onclick="resetReceived()">Сбросить</button>
      </div>
    </main>

    <aside class="right-column">
      <section class="side-card aggro-card app-section" id="aggroPanel">
        <h2>Выбор Цели</h2>

        <div class="button-row">
          <button onclick="addAggroRow()">Добавить цель</button>
        </div>

        <div id="aggroFields"></div>

        <div class="button-row two">
          <button onclick="calculateAggro()">Рассчитать</button>
          <button onclick="resetAggro()">Сбросить</button>
        </div>

        <div class="side-result" id="aggroResult">
          Цель: —
        </div>
      </section>
    </aside>
  </div>

  <script>
    const justiceTable = {
      very_slow: [1, 1.5, 2, 2.5, 3],
      slow: [1, 1.4, 1.9, 2.4, 2.9],
      medium: [1, 1.8, 2.4, 3, 3.2]
    };

    const onslaughtTable = [0.6, 0.7, 0.8, 0.9, 1.0, 1.1, 1.2];

    const defTable = {
      ZAYIN: { ZAYIN: 1, TETH: 0.8, HE: 0.7, WAW: 0.6, ALEPH: 0.4 },
      TETH: { ZAYIN: 1, TETH: 1, HE: 0.8, WAW: 0.7, ALEPH: 0.6 },
      HE: { ZAYIN: 1.2, TETH: 1, HE: 1, WAW: 0.8, ALEPH: 0.7 },
      WAW: { ZAYIN: 1.5, TETH: 1.2, HE: 1, WAW: 1, ALEPH: 0.8 },
      ALEPH: { ZAYIN: 2, TETH: 1.5, HE: 1.2, WAW: 1, ALEPH: 1 }
    };

    function parseMultipliers(str = '') {
      return str.trim()
        ? str.split(/[\s,]+/).map(Number).filter(n => !isNaN(n))
        : [];
    }

    function updateVisibility() {
      const s = document.getElementById('speed').value;
      const f = s === 'fast' || s === 'very_fast';

      document.getElementById('justiceBlock').classList.toggle('hidden', f);
      document.getElementById('onslaughtBlock').classList.toggle('hidden', !f);
      document.getElementById('paleBlock').classList.toggle(
        'hidden',
        document.getElementById('recType').value !== 'pale'
      );
    }

    function getAttackMult() {
      const s = document.getElementById('speed').value;

      return (s === 'fast' || s === 'very_fast')
        ? onslaughtTable[+document.getElementById('onslaughtLevel').value - 1]
        : justiceTable[s][+document.getElementById('justiceLevel').value - 1];
    }

    function getDefMult() {
      return defTable[document.getElementById('weaponClass').value][document.getElementById('armorClass').value];
    }

    function roundNearest(x) {
      return x >= 0 ? Math.floor(x + 0.5) : Math.ceil(x - 0.5);
    }

    function calcDealt() {
      const base = +document.getElementById('base').value || 0;
      const add = +document.getElementById('add').value || 0;

      const personalList = parseMultipliers(document.getElementById('multipliers').value);
      const allyList = parseMultipliers(document.getElementById('multipliers2').value)
        .map(n => Math.max(0, n));

      const personalSum = personalList.reduce((a, b) => a + b, 0);
      const allySum = allyList.reduce((a, b) => a + b, 0);

      const attackMult = getAttackMult();

      const personalRaw = (base * (personalSum / 100 + 1) + add) * attackMult;
      const totalRaw = (base * ((personalSum + allySum) / 100 + 1) + add) * attackMult;

      const personalDamage = roundNearest(personalRaw);
      const totalDamage = roundNearest(totalRaw);

      const allyBonuses = allyList.map((percent) => {
        const rawBonus = base * (percent / 100) * attackMult;
        const roundedBonus = roundNearest(rawBonus);
        const sign = roundedBonus >= 0 ? '+' : '';

        return `<span class="ally-bonus">${percent}% = ${sign}${roundedBonus}</span>`;
      });

      const allyText = allyBonuses.length > 0
        ? '<div class="bonus-title">Бонусы от союзников:</div>' +
          '<div class="bonus-list">' + allyBonuses.join('') + '</div>'
        : '<div class="bonus-title">Бонусы от союзников: —</div>';

      document.getElementById('resultDealt').innerHTML =
        'Итоговый урон: ' + totalDamage +
        '<br>Личный урон: ' + personalDamage +
        allyText;
    }

    function calcReceived() {
      let inc = +document.getElementById('incoming').value || 0;

      if (document.getElementById('recType').value === 'pale') {
        const maxHP = +document.getElementById('maxHP_recv').value || 0;
        const paleMult = +document.getElementById('paleSource_recv').value || 1;
        inc = maxHP * ((inc * paleMult) / 100);
      }

      const personalShield = Math.max(0, +document.getElementById('shield').value || 0);
      const allyShields = parseMultipliers(document.getElementById('shield2').value)
        .map(n => Math.max(0, n));

      const personalDefList = parseMultipliers(document.getElementById('defMultipliers').value)
        .map(n => Math.min(99, n));

      const allyDefList = parseMultipliers(document.getElementById('defMultipliers2').value)
        .map(n => Math.min(99, Math.max(0, n)));

      const originalIncoming = inc;

      const allyShieldTotal = allyShields.reduce((a, b) => a + b, 0);
      const allyBlockedTotal = Math.min(originalIncoming, allyShieldTotal);

      function distributeAllyShields(shields, totalBlocked) {
        const blocked = shields.map(() => 0);
        let remaining = totalBlocked;
        let active = shields
          .map((value, index) => ({ value, index }))
          .filter(item => item.value > 0);

        while (remaining > 0 && active.length > 0) {
          const share = remaining / active.length;
          const capped = active.filter(item => item.value - blocked[item.index] <= share);

          if (capped.length > 0) {
            capped.forEach(item => {
              const canBlock = item.value - blocked[item.index];
              blocked[item.index] += canBlock;
              remaining -= canBlock;
            });

            active = active.filter(item => !capped.includes(item));
          } else {
            active.forEach(item => {
              blocked[item.index] += share;
            });

            remaining = 0;
          }
        }

        return blocked;
      }

      const allyBlockedList = distributeAllyShields(allyShields, allyBlockedTotal);

      const incomingAfterAllyShields = Math.max(0, originalIncoming - allyShieldTotal);
      const personalBlocked = Math.min(personalShield, incomingAfterAllyShields);

      const incomingAfterShields = Math.max(0, originalIncoming - allyShieldTotal - personalShield);

      const personalDefSum = personalDefList.reduce((a, b) => a + b, 0);
      const allyDefSum = allyDefList.reduce((a, b) => a + b, 0);
      const totalDefPercent = personalDefSum + allyDefSum;

      const personalDefPreventedRaw = incomingAfterShields * (personalDefSum / 100);
      const personalDefPrevented = Math.min(incomingAfterShields, Math.max(0, personalDefPreventedRaw));

      const preventedDamage = personalBlocked + personalDefPrevented;
      const preventedDamageMult = 1;
      const preventedDamageShown = roundNearest(preventedDamage * preventedDamageMult);

      const allyDefBadges = allyDefList.map((percent, index) => {
        const rawReduction = incomingAfterShields * (percent / 100);
        const roundedReduction = roundNearest(rawReduction);

        return `<span class="result-badge">${index + 1}) ${percent}% = ${roundedReduction}</span>`;
      });

      inc = incomingAfterShields * (1 - totalDefPercent / 100);
      inc = Math.max(0, inc);

      const result = inc * getDefMult() * (+document.getElementById('res').value || 1);
      const roundedResult = roundNearest(result);

      const receivedShown = incomingAfterShields <= 0
        ? 0
        : Math.max(1, roundedResult);

      const shieldBadges = [];

      if (personalShield > 0) {
        shieldBadges.push(
          `<span class="result-badge">Свой = ${roundNearest(personalBlocked)}</span>`
        );
      }

      allyBlockedList.forEach((blocked, index) => {
        if (allyShields[index] > 0) {
          shieldBadges.push(
            `<span class="result-badge">${index + 1}: ${roundNearest(blocked)}</span>`
          );
        }
      });

      const shieldText = shieldBadges.length > 0
        ? '<div class="result-section">Заблокировано щитами:</div>' +
          '<div class="result-list">' + shieldBadges.join('') + '</div>'
        : '<div class="result-section">Заблокировано щитами: —</div>';

      const allyDefText = allyDefBadges.length > 0
        ? '<div class="result-section">Снижено бонусами от союзников:</div>' +
          '<div class="result-list">' + allyDefBadges.join('') + '</div>'
        : '<div class="result-section">Снижено бонусами от союзников: —</div>';

      document.getElementById('resultReceived').innerHTML =
        'Полученный урон: ' + receivedShown +
        '<br>Предотвращенный урон: ' + preventedDamageShown +
        shieldText +
        allyDefText;
    }

    function resetDealt() {
      document.getElementById('base').value = '';
      document.getElementById('multipliers').value = '';
      document.getElementById('multipliers2').value = '';
      document.getElementById('add').value = '0';
      document.getElementById('speed').value = 'very_slow';
      document.getElementById('justiceLevel').value = '1';
      document.getElementById('onslaughtLevel').value = '1';
      document.getElementById('resultDealt').textContent = 'Нанесённый урон: —';
      updateVisibility();
    }

    function resetReceived() {
      document.getElementById('incoming').value = '';
      document.getElementById('recType').value = 'raw';
      document.getElementById('maxHP_recv').value = '';
      document.getElementById('paleSource_recv').value = '0.25';
      document.getElementById('weaponClass').value = 'ZAYIN';
      document.getElementById('armorClass').value = 'ZAYIN';
      document.getElementById('res').value = '1';
      document.getElementById('resValue').textContent = '1.0';
      document.getElementById('defMultipliers').value = '';
      document.getElementById('defMultipliers2').value = '';
      document.getElementById('shield').value = '';
      document.getElementById('shield2').value = '';
      document.getElementById('resultReceived').textContent = 'Полученный урон: —';
      updateVisibility();
    }

    function generateRandomNumbers() {
      const min = Math.ceil(+document.getElementById('randomMin').value || 0);
      const max = Math.floor(+document.getElementById('randomMax').value || 0);
      const count = Math.max(1, Math.floor(+document.getElementById('randomCount').value || 1));

      const resultBlock = document.getElementById('randomResult');

      if (min > max) {
        resultBlock.innerHTML = 'Ошибка: минимум больше максимума';
        return;
      }

      const numbers = [];

      for (let i = 0; i < count; i++) {
        const value = Math.floor(Math.random() * (max - min + 1)) + min;
        numbers.push(value);
      }

      const sum = numbers.reduce((a, b) => a + b, 0);

      resultBlock.innerHTML =
        'Числа: ' + numbers.join(', ') +
        '<br>Сумма: ' + sum;
    }

    function addAggroRow() {
      const container = document.getElementById('aggroFields');

      const row = document.createElement('div');
      row.className = 'aggro-row';

      row.innerHTML = `
        <input type="text" class="aggro-name" placeholder="Имя">
        <input type="number" class="aggro-value" placeholder="Агро">
        <button type="button" class="aggro-remove" onclick="removeAggroRow(this)" title="Убрать цель">×</button>
      `;

      container.appendChild(row);
    }

    function removeAggroRow(button) {
      const row = button.closest('.aggro-row');

      if (row) {
        row.remove();
      }

      document.getElementById('aggroResult').innerHTML = 'Цель: —';
    }

    function calculateAggro() {
      const rows = document.querySelectorAll('.aggro-row');
      const resultBlock = document.getElementById('aggroResult');

      const entries = [];

      rows.forEach(row => {
        const name = row.querySelector('.aggro-name').value.trim();
        const value = Math.floor(+row.querySelector('.aggro-value').value || 0);

        if (name && value > 0) {
          entries.push({ name, value });
        }
      });

      if (entries.length === 0) {
        resultBlock.innerHTML = 'Цель: —<br>Ошибка: нет целей с агро выше 0';
        return;
      }

      const totalAggro = entries.reduce((sum, item) => sum + item.value, 0);
      const roll = Math.floor(Math.random() * totalAggro) + 1;

      let currentMax = 0;
      let winner = entries[0];

      for (const entry of entries) {
        currentMax += entry.value;

        if (roll <= currentMax) {
          winner = entry;
          break;
        }
      }

      resultBlock.innerHTML = 'Цель: ' + winner.name;
    }

    function resetAggro() {
      document.getElementById('aggroFields').innerHTML = '';
      document.getElementById('aggroResult').innerHTML = 'Цель: —';
    }

    function showTab(panelId, button) {
      document.querySelectorAll('.app-section').forEach(section => {
        section.classList.remove('active');
      });

      document.getElementById(panelId).classList.add('active');

      document.querySelectorAll('.mobile-tabs button').forEach(tabButton => {
        tabButton.classList.remove('active-tab');
      });

      if (button) {
        button.classList.add('active-tab');
      }
    }

    document.getElementById('res').addEventListener('input', () => {
      document.getElementById('resValue').textContent = (+document.getElementById('res').value).toFixed(1);
    });

    window.addEventListener('load', updateVisibility);
  </script>
</body>
