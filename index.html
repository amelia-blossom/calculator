<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Калькулятор Урона</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: #66ff99;
      --accent-dark: #55cc99;
      --bg-overlay: rgba(10, 20, 10, 0.85);
      --text-main: #e0ffe0;
      --text-sub: #99bb99;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      font-family: 'Bebas Neue', sans-serif;
      background: #0d0d0d url('https://images.steamusercontent.com/ugc/1771573146819330998/F47EDBD4BF74B56DB51F227933C4100408938AAE/') no-repeat center/cover fixed;
      color: var(--text-main);
    }
    .container {
      background: var(--bg-overlay);
      border: 2px solid var(--accent);
      border-radius: 12px;
      padding: 2rem 2.5rem;
      max-width: 820px;
      margin: 2rem auto;
      box-shadow: 0 0 20px rgba(102,255,153,.4);
    }
    h1 { text-align: center; color: var(--accent); text-shadow: 0 0 5px #33ff77; font-size: 2.6rem; margin: 0 0 1rem; }
    h2 { margin: 2rem 0 0.5rem; font-size: 1.6rem; color: #aaffcc; border-bottom: 1px solid var(--accent); padding-bottom: 0.3rem; }
    label { display: block; margin-top: 1rem; font-size: 1.2rem; }
    input[type="number"], input[type="text"], select, input[type="range"] {
      width: 100%; padding: 0.75rem; font-size: 1.1rem; background: #111; color: var(--text-main);
      border: 1px solid var(--accent-dark); border-radius: 6px; box-shadow: 0 0 5px rgba(102,255,153,.2);
    }
    input[type="range"] { cursor: pointer; }
    button {
      background: var(--accent-dark); color: #001f0f; border: none; padding: 0.8rem 1.6rem; font-size: 1.2rem; margin-top: 1.5rem;
      border-radius: 6px; cursor: pointer; transition: .25s; box-shadow: 0 0 10px rgba(85,204,153,.4);
    }
    button:hover { background: var(--accent); box-shadow: 0 0 14px rgba(85,255,170,.6); }
    .output { margin-top: 1rem; font-size: 1.4rem; text-align: center; color: #99ffcc; text-shadow: 0 0 3px #33ff77; }
    small { color: var(--text-sub); font-size: 0.9rem; }
    .hidden { display: none; }
    .block { margin-bottom: 3rem; }
    option[value="ZAYIN"] { color: lightgreen; }
    option[value="TETH"] { color: deepskyblue; }
    option[value="HE"] { color: gold; }
    option[value="WAW"] { color: violet; }
    option[value="ALEPH"] { color: red; }
    @media (max-width: 600px) {
      .container { padding: 1rem 1.2rem; margin: 1rem; max-width: 100%; }
      h1 { font-size: 2rem; }
      h2 { font-size: 1.3rem; }
      label { font-size: 1rem; margin-top: 0.8rem; }
      input[type="number"], input[type="text"], select, input[type="range"] { font-size: 0.95rem; padding: 0.6rem; }
      button { width: 100%; font-size: 1rem; padding: 0.7rem 1rem; }
      .output { font-size: 1.2rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Калькулятор Урона</h1>
    <div class="block">
      <h2>Наносимый урон</h2>
      <label>Урон<input type="number" id="base"></label>
      <label>Множители урона <small>(через запятую или пробел)</small><input type="text" id="multipliers"></label>
      <label>Дополнительный урон<input type="number" id="add" value="0"></label>
      <label>Скорость атаки<select id="speed" onchange="updateVisibility()">
        <option value="very_slow">Очень медленная</option>
        <option value="slow">Медленная</option>
        <option value="medium">Средняя</option>
        <option value="fast">Высокая</option>
        <option value="very_fast">Очень высокая</option>
      </select></label>
      <div id="justiceBlock">
        <label>Уровень Справедливости<select id="justiceLevel">
          <option value="1">I</option><option value="2">II</option><option value="3">III</option><option value="4">IV</option><option value="5">V</option>
        </select></label>
      </div>
      <div id="onslaughtBlock" class="hidden">
        <label>Уровень Натиска<select id="onslaughtLevel">
          <option value="1">Рвение</option><option value="2">I</option><option value="3">II</option><option value="4">III</option><option value="5">IV</option><option value="6">Рвение IV+</option><option value="7">Рвение IV++</option>
        </select></label>
      </div>
      <div class="output" id="resultDealt">Нанесённый урон: —</div>
      <button onclick="calcDealt()">Рассчитать</button>
      <button onclick="resetDealt()">Сбросить</button>
    </div>
    <div class="block">
      <h2>Получаемый урон</h2>
      <label>Входящий урон<input type="number" id="incoming"></label>
      <label>Тип входящего урона<select id="recType" onchange="updateVisibility()">
        <option value="raw">Обычный</option><option value="pale">Бледный</option>
      </select></label>
      <div id="paleBlock" class="hidden">
        <label>Максимум ХП юнита<input type="number" id="maxHP_recv"></label>
        <label>Кем наносится урон?<select id="paleSource_recv">
          <option value="0.25">Агент (0.25)</option><option value="1.0">Аномалия (1.0)</option><option value="0.4">Memento Mori (0.4)</option>
        </select></label>
      </div>
      <label>Множители защиты <small>(через запятую или пробел)</small><input type="text" id="defMultipliers"></label>
      <label>Класс оружия<select id="weaponClass">
        <option value="ZAYIN">ZAYIN</option><option value="TETH">TETH</option><option value="HE">HE</option><option value="WAW">WAW</option><option value="ALEPH">ALEPH</option>
      </select></label>
      <label>Класс брони<select id="armorClass">
        <option value="ZAYIN">ZAYIN</option><option value="TETH">TETH</option><option value="HE">HE</option><option value="WAW">WAW</option><option value="ALEPH">ALEPH</option>
      </select></label>
      <label>Сопротивление: <span id="resValue">1.0</span><input type="range" id="res" min="0.1" max="2.0" step="0.1" value="1"></label>
      <div class="output" id="resultReceived">Полученный урон: —</div>
      <button onclick="calcReceived()">Рассчитать</button>
      <button onclick="resetReceived()">Сбросить</button>
    </div>
  </div>
<script>
const justiceTable = { very_slow: [1,1.5,2,2.5,3], slow: [1,1.4,1.9,2.4,2.9], medium: [1,1.8,2.4,3,3.2] };
const onslaughtTable = [0.6,0.7,0.8,0.9,1.0,1.1,1.2];
const defTable = {ZAYIN:{ZAYIN:1,TETH:0.8,HE:0.7,WAW:0.6,ALEPH:0.4},TETH:{ZAYIN:1,TETH:1,HE:0.8,WAW:0.7,ALEPH:0.6},HE:{ZAYIN:1.2,TETH:1,HE:1,WAW:0.8,ALEPH:0.7},WAW:{ZAYIN:1.5,TETH:1.2,HE:1,WAW:1,ALEPH:0.8},ALEPH:{ZAYIN:2,TETH:1.5,HE:1.2,WAW:1,ALEPH:1}};
function parseMultipliers(str) { return str.trim() ? str.split(/[\s,]+/).map(Number).filter(n => !isNaN(n)) : []; }
function updateVisibility() {
  const s = document.getElementById('speed').value;
  const f = s === 'fast' || s === 'very_fast';
  document.getElementById('justiceBlock').classList.toggle('hidden', f);
  document.getElementById('onslaughtBlock').classList.toggle('hidden', !f);
  document.getElementById('paleBlock').classList.toggle('hidden', document.getElementById('recType').value !== 'pale');
}
function getAttackMult() {
  const s = document.getElementById('speed').value;
  return (s === 'fast' || s === 'very_fast') ? onslaughtTable[+document.getElementById('onslaughtLevel').value - 1] : justiceTable[s][+document.getElementById('justiceLevel').value - 1];
}
function getDefMult() {
  return defTable[document.getElementById('weaponClass').value][document.getElementById('armorClass').value];
}
function roundNearest(x) { return x >= 0 ? Math.floor(x + 0.5) : Math.ceil(x - 0.5); }
function calcDealt() {
  const base = +document.getElementById('base').value || 0;
  const add = +document.getElementById('add').value || 0;
  const sum = parseMultipliers(document.getElementById('multipliers').value).reduce((a,b)=>a+b,0);
  const dealtRaw = (base * (sum / 100 + 1) + add) * getAttackMult();
  document.getElementById('resultDealt').textContent = 'Нанесённый урон: ' + roundNearest(dealtRaw);
}
function calcReceived() {
  let inc = +document.getElementById('incoming').value || 0;
  if (document.getElementById('recType').value === 'pale') {
    const maxHP = +document.getElementById('maxHP_recv').value || 0;
    const paleMult = +document.getElementById('paleSource_recv').value || 1;
    inc = maxHP * ((inc * paleMult) / 100);
  }
  parseMultipliers(document.getElementById('defMultipliers').value).forEach(n => { inc *= (1 - n / 100); });
  const result = inc * getDefMult() * (+document.getElementById('res').value || 1);
  document.getElementById('resultReceived').textContent = 'Полученный урон: ' + roundNearest(result);
}
function resetDealt() {
  document.getElementById('base').value = '';
  document.getElementById('multipliers').value = '';
  document.getElementById('add').value = '0';
  document.getElementById('speed').value = 'very_slow';
  document.getElementById('justiceLevel').value = '1';
  document.getElementById('onslaughtLevel').value = '1';
  document.getElementById('resultDealt').textContent = 'Нанесённый урон: —';
  updateVisibility();
}
function resetReceived() {
  document.getElementById('incoming').value = '';
  document.getElementById('recType').value = 'raw';
  document.getElementById('maxHP_recv').value = '';
  document.getElementById('paleSource_recv').value = '0.25';
  document.getElementById('weaponClass').value = 'ZAYIN';
  document.getElementById('armorClass').value = 'ZAYIN';
  document.getElementById('res').value = '1';
  document.getElementById('resValue').textContent = '1.0';
  document.getElementById('defMultipliers').value = '';
  document.getElementById('resultReceived').textContent = 'Полученный урон: —';
  updateVisibility();
}
document.getElementById('res').addEventListener('input', () => {
  document.getElementById('resValue').textContent = (+document.getElementById('res').value).toFixed(1);
});
window.addEventListener('load', updateVisibility);
</script>
</body>
</html>
